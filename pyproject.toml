[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pywnedpasswords"
dynamic = ["version"]

description = "Client for HIBP passwords api using K-Anonymity method"
readme = "README.md"
authors = [
  { name = "Matthias Voppichler", email = "xmatthias@outlook.com" },
]
license = "MIT"
requires-python = ">=3.11"
keywords = ["pwnedpasswords", "passwords", "pwned", "security"]
dependencies = ["requests>=2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/xmatthias/pywnedpasswords"
Documentation = "https://github.com/xmatthias/pywnedpasswords"
"Bug Tracker" = "https://github.com/xmatthias/pywnedpasswords/issues"

[tool.setuptools.dynamic]
version = {attr = "pywnedpasswords.__version__"}

[project.scripts]
pywnedpasswords = "pywnedpasswords.pywnedpasswords:main"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = [
  "C90",    # mccabe
]

[tool.flake8]
max-line-length = 100
max-complexity = 12
